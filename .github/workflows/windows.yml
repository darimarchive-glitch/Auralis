name: Windows bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**','main.py','pyproject.toml','pysidedeploy.spec','.github/workflows/windows.yml']

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - name: Install dependencies
        run: python -m pip install --upgrade pip PySide6==6.12.0 sherpa-onnx==1.13.8 nuitka ordered-set zstandard pytest
      - name: Tests
        shell: pwsh
        run: |
          $env:PYTHONPATH='src'
          pytest -q
      - name: Deploy
        run: pyside6-deploy main.py --name Auralis --force
      - name: Collect portable app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          $dist = Get-ChildItem -Recurse -Directory | Where-Object { $_.Name -eq 'Auralis.dist' } | Select-Object -First 1
          if (-not $dist) { throw 'Auralis.dist was not produced' }
          $launcher = Get-ChildItem -Path $dist.FullName -File -Filter '*.exe' | Select-Object -First 1
          if (-not $launcher) { throw 'No Windows launcher was produced' }
          if ($launcher.Name -ne 'Auralis.exe') {
            Rename-Item -Path $launcher.FullName -NewName 'Auralis.exe'
          }
          Compress-Archive -Path (Join-Path $dist.FullName '*') -DestinationPath artifact\Auralis-Windows-x64.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with: { name: Auralis-Windows-x64, path: artifact/Auralis-Windows-x64.zip }
