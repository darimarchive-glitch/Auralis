name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . nuitka
      - name: Build standalone executable
        shell: pwsh
        run: |
          pyside6-deploy -c pysidedeploy.spec --name Auralis -f
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $dist = Get-ChildItem deployment -Recurse -Directory -Filter "*.dist" | Select-Object -First 1
          if (-not $dist) { throw "Nuitka standalone directory was not produced" }
          Compress-Archive -Path "$($dist.FullName)\*" -DestinationPath artifacts/Auralis-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Auralis-Windows
          path: artifacts/Auralis-Windows-x64.zip
          if-no-files-found: error
