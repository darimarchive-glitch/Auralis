name: Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**','main.py','pyproject.toml','pysidedeploy.spec','.github/workflows/windows.yml']

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - name: Install dependencies
        run: python -m pip install --upgrade pip PySide6==6.12.0 sherpa-onnx==1.13.8 nuitka ordered-set zstandard pytest
      - name: Tests
        shell: pwsh
        run: |
          $env:PYTHONPATH='src'
          pytest -q
      - name: Deploy
        run: pyside6-deploy main.py --name Auralis --force
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Get-ChildItem -Recurse -File | Where-Object { $_.Name -match '^Auralis.*\.exe$' } | ForEach-Object { Copy-Item $_.FullName artifact\Auralis.exe }
          if (-not (Test-Path artifact\Auralis.exe)) { throw 'Auralis.exe was not produced' }
      - uses: actions/upload-artifact@v4
        with: { name: Auralis-Windows, path: artifact/Auralis.exe }
