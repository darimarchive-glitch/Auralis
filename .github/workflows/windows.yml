name: Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, release-3.1.1-flutter]
    paths:
      - 'VERSION'
      - 'pubspec.yaml'
      - 'lib/**'
      - 'windows/**'
      - 'packaging/windows/**'
      - '.github/workflows/windows.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install project
        run: python tool/bootstrap.py

      - name: Tests
        run: flutter test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Windows
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=3.1.1" packaging\windows\Auralis.iss
          if (-not (Test-Path "dist\Auralis-Reader-3.1.1-Setup.exe")) { throw "Installer not produced" }
          (Get-FileHash "dist\Auralis-Reader-3.1.1-Setup.exe" -Algorithm SHA256).Hash.ToLower() + "  Auralis-Reader-3.1.1-Setup.exe" |
            Out-File -Encoding ascii "dist\Auralis-Reader-3.1.1-Setup.exe.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Auralis-Reader-3.1.1-Windows
          path: |
            dist/Auralis-Reader-3.1.1-Setup.exe
            dist/Auralis-Reader-3.1.1-Setup.exe.sha256
          if-no-files-found: error

      - name: Attach EXE to release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v3.1.1"
          for ($i=0; $i -lt 12; $i++) {
            gh release view $tag 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 5
          }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "Auralis Reader 3.1.1" --notes-file RELEASE_NOTES.md
          }
          gh release upload $tag "dist\Auralis-Reader-3.1.1-Setup.exe" "dist\Auralis-Reader-3.1.1-Setup.exe.sha256" --clobber
