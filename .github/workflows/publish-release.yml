name: Publish Auralis 3.1.1 Release

on:
  workflow_dispatch:
  push:
    branches: [main, release-3.1.1-flutter]
    paths:
      - 'VERSION'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v3.1.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Auralis Reader 3.1.1" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA" --latest
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Auralis Reader 3.1.1" --notes-file RELEASE_NOTES.md --latest
          fi
