name: Publish Auralis 2.0.1 Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download validated build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -L --fail             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10660421988/zip"             -o /tmp/android.zip
          unzip -q /tmp/android.zip -d dist

          curl -L --fail             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10659527806/zip"             -o /tmp/windows.zip
          unzip -q /tmp/windows.zip -d dist

          curl -L --fail             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10659997777/zip"             -o /tmp/flatpak.zip
          unzip -q /tmp/flatpak.zip -d dist

          find dist -maxdepth 2 -type f -print

      - name: Prepare release notes
        run: |
          cat > /tmp/release.md <<'EOF'
          ## Auralis Reader 2.0.1

          Esta versão corrige o fechamento do aplicativo durante a instalação da voz neural no Android.

          ### Downloads
          - **Android:** `Auralis-Reader-2.0.1.apk`
          - **Windows:** `Auralis-Reader-2.0.1-Setup.exe`
          - **Linux:** `Auralis-Reader-2.0.1.flatpak`

          ### Voz neural
          - Supertonic 3 INT8 via sherpa-onnx
          - 10 vozes neurais
          - suporte a português e outros idiomas
          - síntese local, sem API paga ou tokens
          - modelo baixado sob demanda e validado por SHA-256

          ### Correção 2.0.1
          A verificação SHA-256 e a descompactação BZip2/TAR do modelo agora rodam em um isolate separado, reduzindo o risco de ANR/fechamento durante a etapa “Verificando download…”.

          Os três pacotes desta release foram gerados e validados por GitHub Actions.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v2.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 &&             gh release delete v2.0.1 --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create v2.0.1             --repo "$GITHUB_REPOSITORY"             --target bc98289c933912062433bdb37ce0451e120a7fb1             --title "Auralis Reader 2.0.1"             --notes-file /tmp/release.md             dist/Auralis-Reader-2.0.1.apk             dist/Auralis-Reader-2.0.1-Setup.exe             dist/Auralis-Reader-2.0.1.flatpak
