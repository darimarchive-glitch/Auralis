name: Publish release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'RELEASE_NOTES.md'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v$VERSION"
          TITLE="Auralis Reader $VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"
          else
            if [[ "$VERSION" == *"-rc"* || "$VERSION" == *"-beta"* || "$VERSION" == *"-alpha"* ]]; then
              gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file RELEASE_NOTES.md --prerelease
            else
              gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file RELEASE_NOTES.md
            fi
          fi
