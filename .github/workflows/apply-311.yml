name: Apply Auralis 3.1.1 Flutter source

on:
  push:
    branches: [release-3.1.1-flutter]
    paths:
      - '.bootstrap/auralis_311_patch.tar.gz.b64'
      - '.github/workflows/apply-311.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-3.1.1-flutter
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Expand source patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .bootstrap/auralis_311_patch.tar.gz.b64 > /tmp/auralis311.tar.gz
          tar -xzf /tmp/auralis311.tar.gz -C .
          rm -rf .bootstrap

      - name: Generate complete native runners
        shell: bash
        run: |
          set -euo pipefail
          python tool/bootstrap.py
          flutter test
          flutter analyze --no-fatal-infos

      - name: Commit complete source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Auralis Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git reset .github/workflows/apply-311.yml
          git add .github/workflows/apply-311.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "release: complete Auralis 3.1.1 Flutter source"
          git push origin HEAD:release-3.1.1-flutter
