name: Apply Auralis 3 rewrite

on:
  push:
    branches: [rewrite-python-3]
    paths:
      - '.bootstrap/auralis3-rewrite.tar.gz.b64'
      - '.github/workflows/rewrite-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite-python-3
          fetch-depth: 0

      - name: Expand rewritten source tree
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .bootstrap/auralis3-rewrite.tar.gz.b64 > /tmp/auralis3.tar.gz
          rm -rf /tmp/auralis3
          mkdir -p /tmp/auralis3
          tar -xzf /tmp/auralis3.tar.gz -C /tmp/auralis3

          # Keep the repository's workflow directory intact: GitHub App tokens
          # cannot push workflow-file changes. Those are applied separately.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .bootstrap -exec rm -rf {} +
          for entry in /tmp/auralis3/* /tmp/auralis3/.[!.]* /tmp/auralis3/..?*; do
            [ -e "$entry" ] || continue
            base="$(basename "$entry")"
            [ "$base" = ".github" ] && continue
            cp -a "$entry" .
          done

      - name: Commit rewrite
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Auralis Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No code changes to commit."
            exit 0
          fi
          git commit -m "rewrite: Auralis 3 Python Qt with literary AI translation"
          git push origin HEAD:rewrite-python-3
