name: Linux Flatpak

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'pubspec.yaml'
      - 'lib/**'
      - 'linux/**'
      - 'packaging/flatpak/**'
      - '.github/workflows/flatpak.yml'

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install Linux and Flatpak build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev             libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev flatpak flatpak-builder

      - name: Install project
        run: python tool/bootstrap.py

      - name: Tests
        run: flutter test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Linux bundle
        run: flutter build linux --release

      - name: Configure Flatpak SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Build Flatpak
        run: |
          rm -rf flatpak-repo build-flatpak dist
          flatpak-builder --user --force-clean --repo=flatpak-repo build-flatpak packaging/flatpak/io.github.darimarchive_glitch.Auralis.yml
          mkdir -p dist
          flatpak build-bundle flatpak-repo dist/Auralis-Reader-3.1.1.flatpak io.github.darimarchive_glitch.Auralis stable
          test -s dist/Auralis-Reader-3.1.1.flatpak
          sha256sum dist/Auralis-Reader-3.1.1.flatpak | tee dist/Auralis-Reader-3.1.1.flatpak.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Auralis-Reader-3.1.1-Flatpak
          path: |
            dist/Auralis-Reader-3.1.1.flatpak
            dist/Auralis-Reader-3.1.1.flatpak.sha256
          if-no-files-found: error

      - name: Attach Flatpak to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v3.1.1
          for i in {1..12}; do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 5
          done
          gh release view "$TAG" >/dev/null 2>&1 ||             gh release create "$TAG" --target "$GITHUB_SHA" --title "Auralis Reader 3.1.1" --notes-file RELEASE_NOTES.md
          gh release upload "$TAG" dist/Auralis-Reader-3.1.1.flatpak dist/Auralis-Reader-3.1.1.flatpak.sha256 --clobber
