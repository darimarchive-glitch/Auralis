name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native runners
        run: python tool/bootstrap.py
      - name: Test
        run: flutter test
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build APK
        run: flutter build apk --release
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Auralis-Reader-2.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Auralis-Reader-2.1.0-Android
          path: dist/Auralis-Reader-2.1.0.apk
          if-no-files-found: error
