name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - '.github/workflows/android.yml'
      - 'pysidedeploy.spec'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y             autoconf automake libtool libtool-bin libltdl-dev m4 pkg-config             zlib1g-dev libffi-dev libssl-dev libsqlite3-dev cmake ninja-build             git zip unzip
          python -m pip install --upgrade pip
          python -m pip install 'PySide6==6.12.0' packaging buildozer cython virtualenv
          ANDROID_REQ="$(python -c "import PySide6, pathlib; print(pathlib.Path(PySide6.__file__).parent / 'scripts' / 'requirements-android.txt')")"
          python -m pip install -r "$ANDROID_REQ"

      - name: Download official Android Qt for Python wheels
        run: |
          mkdir -p android-wheels
          curl -L --fail --retry 4 --retry-delay 3             -o android-wheels/pyside6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl             https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl
          curl -L --fail --retry 4 --retry-delay 3             -o android-wheels/shiboken6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl             https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl
          test -s android-wheels/pyside6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl
          test -s android-wheels/shiboken6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl

      - name: Prepare Android SDK, NDK and target Python
        run: |
          git clone --depth 1 --branch 6.12 https://code.qt.io/pyside/pyside-setup.git /tmp/pyside-setup
          python -m pip install -r /tmp/pyside-setup/tools/cross_compile_android/requirements.txt
          python /tmp/pyside-setup/tools/cross_compile_android/main.py             --plat-name=aarch64             --download-only             --skip-update             --auto-accept-license

      - name: Build installable APK
        run: |
          pyside6-android-deploy             --config-file pysidedeploy.spec             --force             --keep-deployment-files             --name Auralis             --wheel-pyside=android-wheels/pyside6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl             --wheel-shiboken=android-wheels/shiboken6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl

          VERSION="$(tr -d '\r\n' < VERSION)"
          mkdir -p artifacts
          APK="$(find . -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          OUT="artifacts/Auralis-Reader-$VERSION-arm64.apk"
          cp "$APK" "$OUT"
          unzip -t "$OUT" >/dev/null
          sha256sum "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Auralis-Android-APK
          path: artifacts/Auralis-Reader-*-arm64.apk
          if-no-files-found: error

      - name: Attach APK to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v$VERSION"
          OUT="artifacts/Auralis-Reader-$VERSION-arm64.apk"

          for i in 1 2 3 4 5 6 7 8; do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 5
          done

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            EXTRA=()
            if [[ "$VERSION" =~ -(rc|beta|alpha) ]]; then EXTRA+=(--prerelease); fi
            gh release create "$TAG"               --target "$GITHUB_SHA"               --title "Auralis Reader $VERSION"               --notes-file RELEASE_NOTES.md               "${EXTRA[@]}"
          fi

          gh release upload "$TAG" "$OUT" --clobber
