name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['auralis/**','main.py','pyproject.toml','pysidedeploy.spec','.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - name: Install Android SDK/NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          # Buildozer still probes the legacy SDK tools/bin location.
          mkdir -p "$ANDROID_HOME/tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" "$ANDROID_HOME/tools/bin/avdmanager"
      - name: Install deploy tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6==6.12.0 buildozer cython setuptools pytest
          ANDROID_REQ=$(python -c 'from pathlib import Path; import PySide6; print(Path(PySide6.__file__).parent / "scripts" / "requirements-android.txt")')
          python -m pip install -r "$ANDROID_REQ"
      - name: Download Qt for Python Android wheels
        run: |
          mkdir -p wheels
          curl --retry 3 -fL -o wheels/PySide6-android.whl https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl
          curl --retry 3 -fL -o wheels/shiboken6-android.whl https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl
      - name: Core tests
        run: PYTHONPATH=. pytest -q
      - name: Build APK
        run: |
          pyside6-android-deploy --name Auralis             --wheel-pyside="$PWD/wheels/PySide6-android.whl"             --wheel-shiboken="$PWD/wheels/shiboken6-android.whl"             --ndk-path="$ANDROID_HOME/ndk/27.2.12479018" --sdk-path="$ANDROID_HOME"             --extra-modules=QtPdf,QtTextToSpeech,QtMultimedia,QtNetwork --force --keep-deployment-files
      - name: Collect and validate
        run: |
          mkdir -p artifact
          APK=$(find . -type f -name '*.apk' | head -n1)
          test -n "$APK"
          cp "$APK" artifact/Auralis-3.0.0-alpha1.apk
          unzip -t artifact/Auralis-3.0.0-alpha1.apk >/dev/null
          sha256sum artifact/Auralis-3.0.0-alpha1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Auralis-Android-APK
          path: artifact/Auralis-3.0.0-alpha1.apk
