name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VERSION'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt for Python deployment tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'PySide6==6.11.*'
      - name: Download Android PySide wheels
        run: |
          mkdir -p android-wheels
          cd android-wheels
          qtpip download PySide6 --android --arch aarch64
          ls -la
      - name: Prepare Android SDK and NDK for PySide
        run: |
          git clone --depth 1 --branch 6.11 https://code.qt.io/pyside/pyside-setup.git /tmp/pyside-setup
          python /tmp/pyside-setup/tools/cross_compile_android/main.py --download-only --skip-update --auto-accept-license
      - name: Build installable APK
        run: |
          PYSIDE_WHEEL="$(find android-wheels -type f \( -name 'PySide6-*android*aarch64*.whl' -o -name 'PySide6-*aarch64*.whl' \) | head -n 1)"
          SHIBOKEN_WHEEL="$(find android-wheels -type f \( -name 'shiboken6-*android*aarch64*.whl' -o -name 'shiboken6-*aarch64*.whl' \) | head -n 1)"
          test -n "$PYSIDE_WHEEL"
          test -n "$SHIBOKEN_WHEEL"
          pyside6-android-deploy -f --keep-deployment-files --name Auralis \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL"
          mkdir -p artifacts
          APK="$(find . -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" artifacts/Auralis-Android-arm64.apk
          unzip -t artifacts/Auralis-Android-arm64.apk >/dev/null
          sha256sum artifacts/Auralis-Android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Auralis-Android-arm64
          path: artifacts/Auralis-Android-arm64.apk
          if-no-files-found: error
