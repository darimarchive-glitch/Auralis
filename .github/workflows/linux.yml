name: Linux build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - '.github/workflows/linux.yml'
      - 'pysidedeploy.spec'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libspeechd2
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . nuitka ordered-set zstandard
      - name: Build standalone application
        env:
          NUITKA_ASSUME_YES_FOR_DOWNLOADS: "yes"
        run: |
          pyside6-deploy -c pysidedeploy.spec --name Auralis -f
          mkdir -p artifacts
          DIST="$(find dist -type d -name '*.dist' | head -n 1)"
          test -n "$DIST"
          tar -C "$DIST" -czf artifacts/Auralis-Linux-x64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: Auralis-Linux
          path: artifacts/Auralis-Linux-x64.tar.gz
          if-no-files-found: error

      - name: Attach Linux build to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$(tr -d '\r\n' < VERSION)"
          for i in 1 2 3 4 5 6; do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 5
          done
          gh release view "$TAG" >/dev/null 2>&1 ||             gh release create "$TAG" --target "$GITHUB_SHA" --title "Auralis Reader $(cat VERSION)" --notes-file RELEASE_NOTES.md --prerelease
          gh release upload "$TAG" artifacts/Auralis-Linux-x64.tar.gz --clobber
