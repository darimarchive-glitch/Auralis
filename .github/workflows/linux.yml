name: Linux binary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**','main.py','pyproject.toml','pysidedeploy.spec','.github/workflows/linux.yml']

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y patchelf libgl1 libegl1 libpulse0 libspeechd2
      - name: Python dependencies
        run: python -m pip install --upgrade pip PySide6==6.12.0 sherpa-onnx==1.13.8 nuitka ordered-set zstandard pytest
      - name: Tests
        run: PYTHONPATH=src pytest -q
      - name: Deploy
        run: pyside6-deploy main.py --name Auralis --force
      - name: Collect
        run: |
          mkdir -p artifact
          BIN=$(find . -type f \( -name 'Auralis.bin' -o -name 'Auralis' \) | head -n1)
          test -n "$BIN"
          cp "$BIN" artifact/Auralis
          chmod +x artifact/Auralis
      - uses: actions/upload-artifact@v4
        with: { name: Auralis-Linux, path: artifact/Auralis }
