name: Linux Flatpak
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - '.github/workflows/linux.yml'
      - 'pysidedeploy.spec'
      - 'packaging/flatpak/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y             libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4             libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libspeechd2             flatpak flatpak-builder
          python -m pip install --upgrade pip
          python -m pip install . nuitka ordered-set zstandard
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Build standalone application
        env:
          NUITKA_ASSUME_YES_FOR_DOWNLOADS: "yes"
        run: |
          pyside6-deploy -c pysidedeploy.spec --name Auralis -f
          DIST="$(find dist -type d -name '*.dist' | head -n 1)"
          test -n "$DIST"

          if [ ! -x "$DIST/Auralis" ]; then
            CANDIDATE="$(find "$DIST" -maxdepth 1 -type f -perm -111 | head -n 1)"
            test -n "$CANDIDATE"
            mv "$CANDIDATE" "$DIST/Auralis"
          fi

          rm -rf packaging/flatpak/app
          mkdir -p packaging/flatpak/app/Auralis.dist
          cp -a "$DIST"/. packaging/flatpak/app/Auralis.dist/

      - name: Build Flatpak bundle
        run: |
          rm -rf flatpak-build flatpak-repo artifacts
          mkdir -p artifacts
          flatpak-builder --user --force-clean --repo=flatpak-repo             flatpak-build packaging/flatpak/io.github.darimarchive_glitch.Auralis.yml
          VERSION="$(tr -d '\r\n' < VERSION)"
          flatpak build-bundle flatpak-repo             "artifacts/Auralis-Reader-$VERSION.flatpak"             io.github.darimarchive_glitch.Auralis
          test -s "artifacts/Auralis-Reader-$VERSION.flatpak"
          sha256sum "artifacts/Auralis-Reader-$VERSION.flatpak"

      - uses: actions/upload-artifact@v4
        with:
          name: Auralis-Linux-Flatpak
          path: artifacts/Auralis-Reader-*.flatpak
          if-no-files-found: error

      - name: Attach Flatpak to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v$VERSION"
          for i in 1 2 3 4 5 6 7 8; do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 5
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            EXTRA=()
            if [[ "$VERSION" =~ -(rc|beta|alpha) ]]; then EXTRA+=(--prerelease); fi
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Auralis Reader $VERSION" --notes-file RELEASE_NOTES.md "${EXTRA[@]}"
          fi
          gh release upload "$TAG" "artifacts/Auralis-Reader-$VERSION.flatpak" --clobber
