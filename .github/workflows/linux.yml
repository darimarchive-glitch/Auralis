name: Linux bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**','main.py','pyproject.toml','pysidedeploy.spec','.github/workflows/linux.yml']

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y patchelf libgl1 libegl1 libpulse0 libspeechd2
      - name: Python dependencies
        run: python -m pip install --upgrade pip PySide6==6.12.0 sherpa-onnx==1.13.8 nuitka ordered-set zstandard pytest
      - name: Tests
        run: PYTHONPATH=src pytest -q
      - name: Deploy
        run: pyside6-deploy main.py --name Auralis --force
      - name: Collect standalone bundle
        run: |
          mkdir -p artifact
          DIST=$(find . -type d -name 'Auralis.dist' | head -n1)
          test -n "$DIST"
          LAUNCHER=$(find "$DIST" -maxdepth 1 -type f \( -name '*.bin' -o -name 'main' -o -name 'Auralis' \) | head -n1)
          test -n "$LAUNCHER"
          if [ "$(basename "$LAUNCHER")" != "Auralis" ]; then mv "$LAUNCHER" "$DIST/Auralis"; fi
          chmod +x "$DIST/Auralis"
          tar -C "$DIST" -czf artifact/Auralis-Linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with: { name: Auralis-Linux-x64, path: artifact/Auralis-Linux-x64.tar.gz }
