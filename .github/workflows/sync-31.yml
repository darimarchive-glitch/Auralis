name: Sync Auralis 3.1 source
on:
  push:
    branches: [release-3.1-rc]
    paths:
      - '.bootstrap/auralis31-src.tar.gz.b64'
      - '.github/workflows/sync-31.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-3.1-rc
          fetch-depth: 0
      - name: Expand source
        run: |
          set -euo pipefail
          base64 -d .bootstrap/auralis31-src.tar.gz.b64 > /tmp/auralis31.tar.gz
          rm -rf /tmp/auralis31 && mkdir -p /tmp/auralis31
          tar -xzf /tmp/auralis31.tar.gz -C /tmp/auralis31
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .bootstrap -exec rm -rf {} +
          for entry in /tmp/auralis31/* /tmp/auralis31/.[!.]* /tmp/auralis31/..?*; do
            [ -e "$entry" ] || continue
            base="$(basename "$entry")"
            [ "$base" = ".github" ] && continue
            cp -a "$entry" .
          done
      - name: Commit source
        run: |
          git config user.name "Auralis Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "release: Auralis 3.1 interactive reader" || exit 0
          git push origin HEAD:release-3.1-rc
