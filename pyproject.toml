[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auralis-reader"
version = "3.1.0"
description = "Local-first universal book reader, synchronized narrator and literary translator"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - All Rights Reserved"}
dependencies = [
  "PySide6==6.12.0",
]

[project.optional-dependencies]
translation-lite = ["argostranslate>=1.11"]
translation-ai = ["transformers>=4.57", "torch>=2.8", "sentencepiece>=0.2", "accelerate>=1.10"]
neural = ["sherpa-onnx>=1.12", "soundfile>=0.13"]
dev = ["pytest>=8.4", "ruff>=0.13"]

[project.scripts]
auralis = "auralis.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auralis = ["qml/**/*.qml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"


[tool.pyside6-project]
files = [
  "main.py",
  "src/auralis/__init__.py",
  "src/auralis/controller.py",
  "src/auralis/covers.py",
  "src/auralis/db.py",
  "src/auralis/importer.py",
  "src/auralis/main.py",
  "src/auralis/models.py",
  "src/auralis/paths.py",
  "src/auralis/text.py",
  "src/auralis/translation.py",
  "src/auralis/tts.py",
  "src/auralis/qml/Main.qml",
  "src/auralis/qml/components/NavButton.qml",
  "src/auralis/qml/components/VoiceSheet.qml",
  "src/auralis/qml/pages/AudiobookPage.qml",
  "src/auralis/qml/pages/LibraryPage.qml",
  "src/auralis/qml/pages/ReaderPage.qml",
  "src/auralis/qml/pages/TranslatePage.qml",
]
